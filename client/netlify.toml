# Netlify configuration inside client directory
[build]
  publish = ".next"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_PUBLIC_SOLACE_CONTRACT_ID = "CAC2TVMF5TZ3CH3FSORD267USQJTRKX6HFE3YBWSLMYHIDNMDV6PNPN2"
  NEXT_PUBLIC_STELLAR_NETWORK = "testnet"
  NEXT_PUBLIC_STELLAR_RPC_URL = "https://soroban-testnet.stellar.org"

[[plugins]]
  package = "@netlify/plugin-nextjs"
